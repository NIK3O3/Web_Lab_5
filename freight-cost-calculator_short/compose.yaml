name: freight-cost-lab5
services:
  web:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8086}:80"
    environment:
      DB_HOST: db
      DB_NAME: freight_cost
      DB_USER: freight
      DB_PASSWORD: ${DB_PASSWORD:-freight_local_demo}
    depends_on:
      db:
        condition: service_healthy
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      MYSQL_DATABASE: freight_cost
      MYSQL_USER: freight
      MYSQL_PASSWORD: ${DB_PASSWORD:-freight_local_demo}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_demo}
    volumes:
      - freight_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  freight_data:
